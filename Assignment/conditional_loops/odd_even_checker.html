<!DOCTYPE html>
<html>
<head>
    <title>Even or Odd Checker</title>
</head>
<body>

<script>
function checkEvenOdd(num) {
    if (num % 2 === 0) {
        console.log(num + " is an even number.");
    } else {
        console.log(num + " is an odd number.");
    }
}

checkEvenOdd(7);
checkEvenOdd(8);
</script>

</body>
</html>
