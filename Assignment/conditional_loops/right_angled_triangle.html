<!DOCTYPE html>
<html>
<head>
    <title>Right-Angled Triangle</title>
</head>
<body>

<script>
function trianglePattern(n) {
    for (let i = 1; i <= n; i++) {
        let row = "";
        for (let j = 1; j <= i; j++) {
            row += "*";
        }
        console.log(row);
    }
}

trianglePattern(5);
</script>

</body>
</html>
