<!DOCTYPE html>
<html>
<head>
    <title>Square Pattern</title>
</head>
<body>

<script>
function squarePattern(n) {
    for (let i = 1; i <= n; i++) {
        let row = "";
        for (let j = 1; j <= n; j++) {
            row += "*";
        }
        console.log(row);
    }
}

squarePattern(5);
</script>

</body>
</html>
